name: Refresh GitHub Stats

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max tools to process (leave blank for all)"
        required: false
        default: ""
      slug:
        description: "Comma-separated slugs to refresh (leave blank for all)"
        required: false
        default: ""

jobs:
  refresh:
    name: Refresh GitHub Stats
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: core/package-lock.json

      - name: Install dependencies
        working-directory: core
        run: npm ci

      - name: Build CLI args
        id: args
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug=\"${{ github.event.inputs.slug }}\""
          fi
          echo "cli_args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run refresh-github-stats
        working-directory: core
        env:
          GITHUB_TOKEN: ${{ secrets.GH_REFRESH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx scripts/refresh-github-stats.ts ${{ steps.args.outputs.cli_args }}
